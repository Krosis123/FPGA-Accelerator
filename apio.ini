[env:default]
board = nexys-a7-100t
top-module = ferreira_board_top
yosys-extra-options =
    -flatten

[env:sa]
board = nexys-a7-100t
top-module = ferreira_board_top
yosys-extra-options =
    -flatten
nextpnr-extra-options =
    --placer sa
    --seed 2

[env:runtime64]
board = nexys-a7-100t
top-module = grn_board_top
yosys-extra-options =
    -flatten
nextpnr-extra-options =
    --router router2
    --threads 4

[env:runtime64-sa]
board = nexys-a7-100t
top-module = grn_board_top
yosys-extra-options =
    -flatten
nextpnr-extra-options =
    --router router2
    --placer sa
    --seed 2
